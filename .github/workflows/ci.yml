name: CI

# Runs on every push and pull request. Three jobs:
#   1. lint-and-unit  - ruff, unit tests, compose-file and secret-hygiene checks (fast)
#   2. e2e            - the REAL Airflow DAGs and dbt project against Postgres and an
#                       S3 emulator: Raw -> Bronze -> Silver -> Gold, with reconciliation
#                       checks, idempotency checks and every dbt test
on:
  push:
    branches: [main, "week*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests with coverage
        run: pytest tests/unit --cov=src --cov-report=term-missing -q
      - name: Docker Compose file is valid
        run: docker compose --env-file .env.example -f docker/docker-compose.yml config -q
      - name: No secrets committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git - remove it and rotate its secrets"; exit 1
          fi
          if grep -nE '^[A-Z_]*(KEY|SECRET|PASSWORD|SALT)=[0-9a-f]{32,}$' .env.example; then
            echo "::error::.env.example contains what looks like a real secret"; exit 1
          fi
          echo "ok"

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retaillake
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: retaildb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retaillake" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: retaillake
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: retaildb
      MINIO_ENDPOINT: http://127.0.0.1:5000
      MINIO_ROOT_USER: ci_user
      MINIO_ROOT_PASSWORD: ci_password_123
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      DBT_BIN: ${{ github.workspace }}/.dbt-venv/bin/dbt
      AIRFLOW_BIN: airflow
      RETAIL_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Airflow (pinned to the version in docker-compose) and test dependencies
        run: |
          pip install "apache-airflow==2.9.3" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-3.11.txt"
          pip install -r requirements-dev.txt
      - name: Install dbt 1.8 (own virtualenv - same major version as docker-compose)
        run: |
          python -m venv .dbt-venv
          .dbt-venv/bin/pip install -q "dbt-core==1.8.9" "dbt-postgres==1.8.2"
      - name: Start an S3 endpoint (moto) standing in for MinIO
        run: |
          python -m venv .moto-venv
          .moto-venv/bin/pip install -q "moto[server]"
          nohup .moto-venv/bin/moto_server -p 5000 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:5000 && break; sleep 1; done
      - name: Initialize Airflow's metadata database
        run: airflow db migrate
      - name: DAG integrity + end-to-end pipeline tests
        run: pytest tests/dags tests/e2e -v
      - name: Keep dbt results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence
          path: |
            dbt_smart_retail/target/run_results.json
            dbt_smart_retail/logs/dbt.log
            moto.log
          if-no-files-found: ignore
